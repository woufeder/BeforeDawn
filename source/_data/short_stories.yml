      items:
        - name:
            zh-tw: 雲居(くもゐ)
            en: ''
            it: ''
          description:
            zh-tw: 又稱靈峰，被當地人稱為聖山。傳說彼岸鄉的所在地，以變幻莫測的天氣聞名。傳說有能治癒一切病痛的泉水，有許多人慕名上山，卻再也沒有回來。
            en: ''
            it: ''
        - name:
            zh-tw: 彼岸鄉（彼方の里）
            en: ''
            it: ''
          description:
            zh-tw: 雲居山上的小村落。沒有人知道實際地點在哪，山下的人便稱這座村落為彼岸鄉。
            en: ''
            it: ''
        - name:
            zh-tw: 泉守(いづみもり)
            en: ''
            it: ''
          description:
            zh-tw: 彼岸鄉內的神社，供奉著當地的泉水之靈。歷代的宮司皆為女性。
            en: ''
            it: ''
        - name:
            zh-tw: 竹船祭（笹舟祭）
            en: ''
            it: ''
          description:
            zh-tw: 彼岸鄉一年一度的祭典。將竹葉折成小船放入河中，希望水能帶走災厄與病痛，淨化來年的運勢。
            en: ''
            it: ''

      linkText:
        zh-tw: ''

        en: |-

        it: |-

