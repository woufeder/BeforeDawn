overview:
  intro:
    zh-tw: |-
      它也許很小，淺薄得可以。但這都不礙繁星在夜裡閃閃發光，相約墜地的鋒芒。
      那可以是一場單純的夢，一份無處安放的念想，或是頻頻躁動卻不知從說起的渴望。

      我想，偶爾也不用那麼嚴謹，對嗎？

    en: |-
      

    it: |-

  details:
    zh-tw: |-
      此區為偶爾作夢夢到的故事，或臨時腦洞的坑，題材種類繁雜時空範圍不定。
      部分故事與其它中長篇原創有共用世界觀，但可視為為獨立篇章，互不影響。

      由於部分故事為夢境改寫，情節與史實恐有諸多不符，若有出入請視同架空，切勿深入考據。

    en: |-

    it: |-

