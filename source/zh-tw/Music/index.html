<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音樂 | Before Dawn</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 3rem;
      background: rgba(13, 13, 13, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    nav .logo {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      margin-left: 2rem;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #fff;
    }

    nav select {
      padding: 0.5rem;
      background: rgba(255, 255, 255, 0.1);
      color: #aaa;
      border: 1px solid #444;
      border-radius: 3px;
      cursor: pointer;
    }

    .content {
      margin-top: 100px;
      padding: 3rem;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    .content h1 {
      font-size: 2.5rem;
      margin-bottom: 2rem;
    }

    .content p {
      color: #aaa;
      line-height: 1.8;
      margin-bottom: 1.5rem;
    }

    footer {
      text-align: center;
      padding: 3rem;
      border-top: 1px solid #1a1a1a;
      color: #444;
      font-size: 0.85rem;
    }

    footer a {
      color: #666;
      text-decoration: none;
    }

    footer a:hover {
      color: #aaa;
    }

    .hp-field {
      position: absolute;
      left: -9999px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <nav>
    <div class="logo">Before Dawn</div>
    <div style="display: flex; align-items: center; gap: 2rem;">
      <div>
        <a href="/BeforeDawn/zh-tw/">首頁</a>
        <a href="/BeforeDawn/zh-tw/about/">關於</a>
        <a href="/BeforeDawn/zh-tw/original/">創意</a>
        <a href="/BeforeDawn/zh-tw/project/">作品</a>
        <a href="/BeforeDawn/zh-tw/music/">音樂</a>
        <a href="/BeforeDawn/zh-tw/others/">其他</a>
        <a href="/BeforeDawn/zh-tw/blog/">文章</a>
      </div>
      <select onchange="if(this.value) location.href = this.value;">
        <option value="">語言</option>
        <option value="/BeforeDawn/en/music/">English</option>
        <option value="/BeforeDawn/zh-tw/music/">中文</option>
      </select>
    </div>
  </nav>

  <div class="content">
    <h1>音樂</h1>
    <p>在這裡分享你的音樂收藏、播放清單或與音樂相關的內容。無論是你的原創作曲還是最喜歡的歌曲，這是你展示你對音樂熱情的空間。</p>
  </div>
  <section id="link-area" class=" mt-10">



    <form id="contact-form">
      <label>
        Name
        <input type="text" name="name" required>
      </label>

      <label>
        Email
        <input type="email" name="email">
      </label>

      <label>
        Message
        <textarea name="message" required></textarea>
      </label>

      <div class="hp-field" aria-hidden="true">
        <label>
          Leave this field empty
          <input type="text" name="_gotcha" tabindex="-1" autocomplete="off">
        </label>
      </div>

      <button type="submit">Send</button>
      <p id="form-status"></p>
    </form>
  </section>
  <footer>
    <p>© 2026 woufeder · <a href="https://github.com/woufeder">GitHub</a> · <a href="/BeforeDawn/zh-tw/blog/">文章</a></p>
  </footer>

  <script>
    const form = document.getElementById('contact-form');
    const status = document.getElementById('form-status');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const honeypot = form.querySelector('[name="_gotcha"]');

      if (honeypot && honeypot.value) {
        status.textContent = 'Message sent. Thank you.';
        form.reset();
        return;
      }

      status.textContent = 'Sending...';

      const formData = new FormData(form);

      try {
        const res = await fetch('https://formspree.io/f/xdajdzqq', {
          method: 'POST',
          body: formData,
          headers: {
            Accept: 'application/json',
          },
        });

        if (res.ok) {
          status.textContent = 'Message sent. Thank you.';
          form.reset();
        } else {
          status.textContent = 'Something went wrong. Please try again.';
        }
      } catch (error) {
        status.textContent = 'Network error. Please try again later.';
      }
    });
  </script>
</body>

</html>
